# DQN Training Configuration for Snake RL

# Environment settings
environment:
  grid_width: 24
  grid_height: 20
  step_penalty: -0.01
  food_reward: 1.0
  death_reward: -1.0
  max_steps_multiplier: 4.0
  distance_reward_scale: 0.1  # Reward shaping for guiding toward food
  loop_penalty: -0.05  # Penalty for circular movement patterns
  exploration_reward_scale: 0.02  # Reward for visiting new/less-visited cells
  loop_detection_window: 8  # Number of recent positions to track for loop detection

# DQN hyperparameters
dqn:
  learning_rate: 0.0001
  gamma: 0.99
  batch_size: 64
  target_update: 1000
  buffer_size: 100000
  train_start: 10000
  hidden_size: 256  # Network hidden layer size
  n_step: 1  # N-step returns (1 = standard TD)
  gradient_steps: 1  # Gradient steps per training call
  dueling: true  # Use Dueling DQN architecture

# Training settings
training:
  total_steps: 500000
  seed: 1337
  device: auto  # auto, cpu, or cuda
  checkpoint_dir: checkpoints
  eval_interval: 10000
  eval_episodes: 5

# Epsilon-greedy exploration
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 200000

# GPU optimization settings (only effective when using CUDA)
gpu_optimization:
  use_amp: false  # Automatic Mixed Precision - can provide 2-3x speedup on modern GPUs
  pin_memory: false  # Pin memory for faster CPU-to-GPU data transfer (may add overhead)
  gradient_accumulation_steps: 1  # Accumulate gradients for larger effective batch sizes

# Logging (optional)
# Uncomment and configure as needed
# logging:
#   log_file: logs/training.log
#   no_console_log: false
