# DQN Training Configuration for Snake RL

# Environment settings
environment:
  grid_width: 24
  grid_height: 20
  step_penalty: -0.01
  food_reward: 1.0
  death_reward: -1.0
  max_steps_multiplier: 4.0

# DQN hyperparameters
dqn:
  learning_rate: 0.0001
  gamma: 0.99
  batch_size: 64
  target_update: 1000
  buffer_size: 100000
  train_start: 10000

# Training settings
training:
  total_steps: 500000
  seed: 1337
  device: auto  # auto, cpu, or cuda
  checkpoint_dir: checkpoints
  eval_interval: 10000
  eval_episodes: 5

# Epsilon-greedy exploration
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 200000
