# GPU-Optimized Configuration for Snake RL
# This configuration enables all GPU optimizations for maximum training speed

# Environment settings
environment:
  grid_width: 24
  grid_height: 20
  step_penalty: -0.01
  food_reward: 1.0
  death_reward: -1.0
  distance_reward_scale: 0.1  # Reward shaping for guiding toward food

# DQN hyperparameters (optimized for larger batch size)
dqn:
  learning_rate: 0.0002  # Increased LR for larger effective batch size
  gamma: 0.99
  batch_size: 128  # Larger batch size for GPU
  target_update: 1000
  buffer_size: 100000
  train_start: 10000

# Training settings
training:
  total_steps: 500000
  seed: 1337
  device: cuda  # Force GPU usage
  checkpoint_dir: checkpoints
  eval_interval: 10000
  eval_episodes: 5

# Epsilon-greedy exploration
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 200000

# GPU optimization settings (all enabled)
gpu_optimization:
  use_amp: true  # Automatic Mixed Precision for 2-3x speedup
  pin_memory: true  # Enable pinned memory for faster CPU-GPU transfers
  gradient_accumulation_steps: 1  # Can increase for larger effective batch
  compile_model: true  # Use torch.compile for optimized execution (PyTorch 2.0+, Linux/macOS only)

# Notes:
# - This config is optimized for NVIDIA GPUs with Tensor Cores (RTX 20xx+)
# - If you get OOM errors, reduce batch_size or buffer_size
# - For limited GPU memory, increase gradient_accumulation_steps and reduce batch_size
# - Expected speedup: 15-20x faster than CPU training
# - GPU-optimized replay buffer stores data directly on GPU (zero-copy sampling)
# - Pinned memory enables async CPU-GPU transfers for better throughput
# - torch.compile provides additional 20-30% speedup on PyTorch 2.0+ (first run slower due to compilation)
# - Windows users: torch.compile is not supported (requires Triton). Set compile_model to false or ignore the warning
