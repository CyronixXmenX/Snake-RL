# High-Throughput Configuration for Snake RL
# Optimized for maximum GPU utilization and training speed
# Target: >50% GPU utilization during updates, batch_size >= 512

# Environment settings
environment:
  grid_width: 24
  grid_height: 20
  step_penalty: -0.01
  food_reward: 1.0
  death_reward: -1.0
  distance_reward_scale: 0.1  # Dense reward shaping
  loop_penalty: -0.05  # Prevent circular patterns
  exploration_reward_scale: 0.02  # Encourage exploration
  loop_detection_window: 8

# DQN hyperparameters (high-throughput optimized)
dqn:
  learning_rate: 0.0003  # Higher LR for larger batches
  gamma: 0.99
  batch_size: 1024  # Large batch for GPU efficiency (target: 512-4096)
  target_update: 10000  # Less frequent updates for stability
  buffer_size: 1000000  # 1M transitions
  train_start: 50000  # Prefill buffer more before training
  hidden_size: 512  # Larger network to utilize GPU
  n_step: 3  # 3-step returns for faster learning
  gradient_steps: 16  # Multiple gradient steps per env step
  dueling: true  # Dueling architecture

# Training settings
training:
  total_steps: 2000000  # 2M steps for thorough training
  seed: 42
  device: cuda
  checkpoint_dir: checkpoints
  eval_interval: 25000
  eval_episodes: 10
  n_envs: 8  # Vectorized environments for higher throughput
  train_freq: 4  # Train every 4 env steps

# Epsilon-greedy exploration
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.01  # Lower final epsilon
  epsilon_decay_steps: 1000000  # Longer exploration phase

# GPU optimization settings (maximize GPU utilization)
gpu_optimization:
  use_amp: true  # Mixed precision training
  pin_memory: false  # Not needed with GPU buffer
  gradient_accumulation_steps: 1  # Already using large batches
  compile_model: true  # torch.compile for 20-30% speedup

# Expected Performance:
# - GPU utilization: >50% during training steps (peaks higher)
# - Throughput: 500-1000+ steps/sec (depends on GPU)
# - Speedup: 20-50x faster than CPU baseline
# - Mean return target: >5.0 within 2M steps (depends on game difficulty)

# Notes:
# - Adjust batch_size based on GPU VRAM (1024-4096 for modern GPUs)
# - Increase n_envs for better CPU env parallelism (8-16 recommended)
# - Use gradient_steps to keep GPU busy between env collections
# - Set train_freq=4 or lower to train more frequently
# - Increase buffer_size to 1M-10M if RAM allows
